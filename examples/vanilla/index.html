<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Scoring Widget - Vanilla HTML Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .widget-wrapper {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .demo-controls {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .demo-controls h3 {
      margin-bottom: 1rem;
      color: #333;
    }

    .demo-controls button {
      background: #667eea;
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
      transition: background 0.2s;
    }

    .demo-controls button:hover {
      background: #5568d3;
    }

    .event-log {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 1rem;
      margin-top: 1rem;
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
    }

    .event-log-item {
      padding: 0.5rem;
      border-bottom: 1px solid #dee2e6;
    }

    .event-log-item:last-child {
      border-bottom: none;
    }

    .event-log-item .timestamp {
      color: #6c757d;
      font-size: 0.75rem;
    }

    @media (max-width: 768px) {
      .header h1 {
        font-size: 1.75rem;
      }

      .header p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏦 Credit Scoring SDK</h1>
      <p>Vanilla HTML Integration Example</p>
    </div>

    <div class="widget-wrapper">
      <!-- The Web Component integrates with a simple HTML tag -->
      <credit-scoring-widget
        id="widget"
        config-id="demo-001"
        api-url="http://localhost:3000"
      ></credit-scoring-widget>
    </div>

    <div class="demo-controls">
      <h3>Demo Controls</h3>
      <button onclick="changeTheme('blue')">Blue Theme</button>
      <button onclick="changeTheme('green')">Green Theme</button>
      <button onclick="changeTheme('purple')">Purple Theme</button>
      <button onclick="resetWidget()">Reset Widget</button>

      <div class="event-log" id="eventLog">
        <div style="color: #6c757d; text-align: center; padding: 1rem;">
          Widget events will appear here...
        </div>
      </div>
    </div>
  </div>

  <!-- Import the Web Component -->
  <!-- In production, this would be something like: -->
  <!-- <script type="module" src="https://cdn.example.com/credit-scoring-widget.mjs"></script> -->
  <!-- For local development, use the compiled file: -->
  <script type="module" src="../../packages/web-component/dist/credit-scoring-widget.mjs"></script>

  <script>
    const widget = document.getElementById('widget');
    const eventLog = document.getElementById('eventLog');

    // Escuchar eventos del widget
    widget.addEventListener('submit-success', (e) => {
      logEvent('✅ Formulario enviado con éxito', e.detail);
    });

    widget.addEventListener('submit-error', (e) => {
      logEvent('❌ Error al enviar formulario', e.detail);
    });

    // Función para cambiar el tema dinámicamente
    function changeTheme(theme) {
      const themes = {
        blue: {
          '--cs-primary-color': '#0066cc',
          '--cs-secondary-color': '#6c757d',
        },
        green: {
          '--cs-primary-color': '#28a745',
          '--cs-secondary-color': '#20c997',
        },
        purple: {
          '--cs-primary-color': '#6f42c1',
          '--cs-secondary-color': '#e83e8c',
        }
      };

      const themeColors = themes[theme];
      if (themeColors) {
        Object.entries(themeColors).forEach(([prop, value]) => {
          widget.style.setProperty(prop, value);
        });
        logEvent(`🎨 Tema cambiado a: ${theme}`);
      }
    }

    // Función para resetear el widget
    function resetWidget() {
      // Recargar el widget cambiando el config-id
      const currentId = widget.getAttribute('config-id');
      widget.setAttribute('config-id', '');
      setTimeout(() => {
        widget.setAttribute('config-id', currentId);
        logEvent('🔄 Widget reseteado');
      }, 100);
    }

    // Función para loggear eventos
    function logEvent(message, data) {
      const timestamp = new Date().toLocaleTimeString();
      const logItem = document.createElement('div');
      logItem.className = 'event-log-item';
      logItem.innerHTML = `
        <div class="timestamp">${timestamp}</div>
        <div>${message}</div>
        ${data ? `<pre style="margin-top: 0.5rem; font-size: 0.75rem;">${JSON.stringify(data, null, 2)}</pre>` : ''}
      `;

      // Limpiar el mensaje inicial si existe
      if (eventLog.children.length === 1 && eventLog.children[0].style.textAlign === 'center') {
        eventLog.innerHTML = '';
      }

      eventLog.insertBefore(logItem, eventLog.firstChild);

      // Limitar a 10 eventos
      while (eventLog.children.length > 10) {
        eventLog.removeChild(eventLog.lastChild);
      }
    }

    // Log inicial
    logEvent('🚀 Widget inicializado');
  </script>
</body>
</html>
